approach_cost_runner_node:
  ros__parameters:
    feasible_map_topic: "/approach/feasible_map"
    transition_map_topic: "/approach/transition_count_map"
    target_point_topic: "/approach/target_point"
    grasp_targets_topic: "/approach/grasp_targets"
    grasp_status_topic: "/approach/grasp_status"
    robot_frame_id: "base_nav"
    output_topic: "/approach/final_cost_map"
    arrow_topic: "/approach/best_cost_arrow"
    candidate_arrow_topic: "/approach/candidate_cost_arrow"
    approach_ready_topic: "/approach/approach_ready"
    transform_timeout_sec: 0.1
    exclude_visited_from_goals: true
    visited_rear_only: true   # only exclude visited cells behind the robot (toward-target corridor kept)
    grasp_look_at_centroid: true   # mode1: face the grasp-objects midpoint (perpendicular alignment about it)
    grasp_radius_m: 0.9
    robot_start_search_radius_m: 0.20
    min_feasible_cells: 25
    best_neighbor_radius_m: 0.30
    min_best_neighbor_cells: 3
    stable_duration_sec: 0.70
    stable_position_tolerance_m: 0.15
    debug_save_enable: true
    debug_output_dir: "/home/nvidia/inha_log/module/approach_cost_debug"
    debug_save_every_n_frames: 20
    debug_max_frames_per_session: 600
